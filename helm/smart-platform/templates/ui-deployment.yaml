apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-ui-deployment
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.ui.replicaCount }}
  selector:
    matchLabels:
      app: smart-ui
  template:
    metadata:
      labels:
        app: smart-ui
    spec:
      containers:
        - name: smart-ui
          image: "{{ .Values.ui.image.repository }}:{{ .Values.ui.image.tag }}"
          imagePullPolicy: {{ .Values.ui.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.ui.port }}
          env:
            - name: EDGE_SERVICE_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: smart-platform-configmap
                  key: smart-edge-service-external-url
            - name: LOTTERY_SERVICE_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: smart-platform-configmap
                  key: smart-lottery-service-external-url
          resources:
            requests:
              memory: {{ .Values.ui.resources.requests.memory | quote }}
              cpu: {{ .Values.ui.resources.requests.cpu | quote }}
            limits:
              memory: {{ .Values.ui.resources.limits.memory | quote }}
              cpu: {{ .Values.ui.resources.limits.cpu | quote }}
