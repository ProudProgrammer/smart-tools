apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-lottery-service-deployment
  namespace: smart-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smart-lottery-service
  template:
    metadata:
      labels:
        app: smart-lottery-service
    spec:
      containers:
        - name: smart-lottery-service
          image: smart-lottery-service:1.0-SNAPSHOT
          imagePullPolicy: Never
          ports:
            - containerPort: 8081
          env:
            - name: JAVA_ARGS
              value: "-Xms32m -Xmx96m -XX:+UseContainerSupport -Duser.timezone=Europe/Budapest"
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          volumeMounts:
            - name: logs-storage
              mountPath: /app/logs
      volumes:
        - name: logs-storage
          persistentVolumeClaim:
            claimName: smart-lottery-service-logs-pvc
